<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaneet Tanwar | Graphic Designer</title>

<style>/* MOBILE FIX */
@media (max-width: 768px) {

  .header{
    padding:16px 20px;
  }

  .logo img{
    height:42px;   /* signature chhota */
  }

  .nav-wrapper{
    display:none;  /* mobile par menu hide */
  }

  .hire-btn{
    padding:10px 18px;
    font-size:13px;
  }

}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body{
  background:#ffffff;
}

/* HEADER */
.header{
  width:100%;
  padding:20px 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* LOGO */
.logo img{
  height:60px;
}

/* NAV BAR */
.nav-wrapper{
  background:#e9f1ff;
  padding:14px 26px;
  border-radius:50px;
  display:flex;
  align-items:center;
  gap:30px;
}

.nav-wrapper a{
  text-decoration:none;
  color:#0b3a75;
  font-size:15px;
  font-weight:500;
}

/* HIRE BUTTON */
.hire-btn{
  margin-left:30px;
  padding:14px 28px;
  background:#0b3a75;
  color:#ffffff;
  border-radius:40px;
  text-decoration:none;
  font-size:15px;
  font-weight:500;
}

/* RESPONSIVE */
@media(max-width:768px){
  .nav-wrapper{
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">
  <!-- LEFT LOGO -->
  <div class="logo">
    <img src="logo.png" alt="Vaneet Tanwar">
  </div>

  <!-- CENTER NAV -->
  <div class="nav-wrapper">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </div>

  <!-- RIGHT BUTTON -->
  <a href="mailto:your@email.com" class="hire-btn">Hire Me</a>
</header>

</body>
</html>
