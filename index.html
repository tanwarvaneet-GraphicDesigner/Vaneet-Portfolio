<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaneet Tanwar | Graphic Designer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

body{
  background:#f6f9ff;
  color:#0a2540;
}

/* ================= HEADER ================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 6%;
  background:#ffffff;
  position:sticky;
  top:0;
  z-index:100;
}

/* LOGO */
.logo img{
  height:68px;
}

/* OLD NAV PILL STYLE */
.nav-pill{
  display:flex;
  gap:30px;
  background:#e9f1ff;
  padding:14px 34px;
  border-radius:50px;
  animation:navEnter 0.9s ease forwards;
}

.nav-pill a{
  text-decoration:none;
  font-weight:500;
  color:#0a2540;
  padding:6px 4px;
  transition:0.3s;
}

.nav-pill a:hover{
  color:#1e5eff;
}

/* HIRE BUTTON */
.hire-btn{
  background:#1e5eff;
  color:#fff;
  padding:14px 34px;
  border-radius:50px;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

.hire-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(30,94,255,0.35);
}

/* ================= HERO ================= */
.hero{
  display:flex;
  align-items:center;
  gap:70px;
  padding:90px 6%;
}

.hero img{
  width:380px;
  border-radius:30px;
  animation:float 4s ease-in-out infinite;
}

.hero h1{
  font-size:56px;
  line-height:1.1;
  animation:fadeUp 1s ease;
}

.hero h1 span{
  color:#1e5eff;
}

.hero p{
  margin-top:20px;
  font-size:18px;
  max-width:520px;
  color:#555;
  animation:fadeUp 1.2s ease;
}

.hero .btn{
  display:inline-block;
  margin-top:30px;
  background:#1e5eff;
  color:#fff;
  padding:16px 42px;
  border-radius:50px;
  text-decoration:none;
  font-weight:600;
  animation:pulse 2s infinite;
}

/* ================= ANIMATIONS ================= */
@keyframes navEnter{
  from{
    opacity:0;
    transform:translateY(-15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(30,94,255,0.5);}
  70%{box-shadow:0 0 0 18px rgba(30,94,255,0);}
  100%{box-shadow:0 0 0 0 rgba(30,94,255,0);}
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  header{
    flex-direction:column;
    gap:16px;
  }

  .nav-pill{
    display:none;
  }

  .hero{
    flex-direction:column;
    text-align:center;
  }

  .hero img{
    width:260px;
  }

  .hero h1{
    font-size:38px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Vaneet Tanwar">
  </div>

  <!-- OLD NAV -->
  <nav class="nav-pill">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </nav>

  <a href="#" class="hire-btn">Hire Me</a>
</header>

<section class="hero">
  <img src="profile.jpg" alt="Vaneet Tanwar">
  <div>
    <h1>Experienced Graphic Designer <br><span>& Meta Ads Expert</span></h1>
    <p>
      Professional graphic designer with 7+ years of experience helping brands grow
      through clean, conversion-focused design and high-performing Meta ad creatives.
    </p>
    <a href="#" class="btn">Let’s Talk</a>
  </div>
</section>

</body>
</html>
