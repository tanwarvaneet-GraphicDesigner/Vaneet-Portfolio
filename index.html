<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaneet Tanwar | Graphic Designer & Meta Ads Expert</title>

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI",
  Roboto, Helvetica, Arial, sans-serif;
}

body{
  background:#f7f9fc;
  color:#0a1a2f;
}

/* ===== HEADER (HEIGHT REDUCED ONLY) ===== */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 42px;   /* 👈 HEIGHT REDUCED */
  position:sticky;
  top:0;
  z-index:1000;
  background:#f7f9fc;
  transition:box-shadow 0.3s ease;
}

header.scrolled{
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

/* LOGO */
.logo img{
  height:52px;   /* 👈 LOGO SIZE REDUCED */
}

/* NAV */
.nav{
  background:#e6efff;
  padding:8px 22px;   /* 👈 NAV HEIGHT REDUCED */
  border-radius:50px;
}

.nav a{
  margin:0 14px;
  text-decoration:none;
  font-size:14px;
  font-weight:500;
  color:#0a1a2f;
  display:inline-block;
  transition:transform 0.25s ease;
}

.nav a:hover{
  transform:scale(1.12);
}

/* BUTTON */
.hire-btn{
  background:#0a3cff;
  color:#fff;
  text-decoration:none;
  padding:10px 26px;   /* 👈 BUTTON HEIGHT REDUCED */
  border-radius:50px;
  font-size:14px;
  font-weight:600;
  animation:pulse 2.2s infinite;
}

.hire-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 35px rgba(10,60,255,0.35);
}

/* ===== ANIMATION (UNCHANGED) ===== */
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(10,60,255,0.45);}
  70%{box-shadow:0 0 0 16px rgba(10,60,255,0);}
  100%{box-shadow:0 0 0 0 rgba(10,60,255,0);}
}

/* MOBILE */
@media(max-width:900px){
  header{padding:12px 18px;}
  .logo img{height:44px;}
  .nav{display:none;}
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Vaneet Tanwar">
  </div>

  <nav class="nav">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </nav>

  <a href="#" class="hire-btn">Hire Me</a>
</header>

<!-- PAGE CONTENT BELOW (UNCHANGED / YOUR EXISTING SECTIONS GO HERE) -->

<script>
window.addEventListener("scroll",()=>{
  document.querySelector("header")
  .classList.toggle("scrolled",window.scrollY>10);
});
</script>

</body>
</html>
