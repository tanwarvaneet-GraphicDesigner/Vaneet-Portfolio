<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaneet Tanwar | Graphic Designer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI",
  Roboto, Helvetica, Arial, sans-serif;
}

body{
  background:#fbfbf6;
  color:#062a23;
}

/* ===== HEADER ===== */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:24px 48px;
}

.logo img{
  height:52px;
}

.nav{
  background:#dff2a0;
  padding:10px 26px;
  border-radius:50px;
}

.nav a{
  margin:0 14px;
  text-decoration:none;
  font-size:15px;
  font-weight:500;
  color:#062a23;
}

.hire-btn{
  background:#062a23;
  color:#fff;
  text-decoration:none;
  padding:12px 26px;
  border-radius:50px;
  font-size:14px;
  font-weight:600;
}

/* ===== HERO ===== */
.hero{
  max-width:1200px;
  margin:80px auto;
  padding:0 48px;
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:60px;
  align-items:center;
}

.hero-img{
  background:#eaf7c5;
  border-radius:28px;
  padding:40px;
}

.hero-img img{
  width:100%;
  border-radius:22px;
}

.hero-content h1{
  font-size:64px;
  line-height:1.05;
  margin-bottom:20px;
}

.hero-content h1 span{
  display:block;
}

.hero-content p{
  font-size:18px;
  color:#4b5b57;
  line-height:1.7;
  margin-bottom:34px;
}

.cta{
  background:#ff7a33;
  color:#fff;
  text-decoration:none;
  padding:16px 36px;
  border-radius:40px;
  font-size:16px;
  font-weight:600;
}
