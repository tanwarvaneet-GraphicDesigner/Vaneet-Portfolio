<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaneet Tanwar | Graphic Designer</title>

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI",
  Roboto, Helvetica, Arial, sans-serif;
}

body{
  background:#ffffff;
  color:#0a0a0a;
}

/* ===== HEADER ===== */
.header{
  width:100%;
  padding:24px 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* LOGO */
.logo img{
  height:55px;
}

/* NAV */
.nav-wrapper{
  background:#eaf2ff;
  padding:10px 26px;
  border-radius:50px;
}

.nav-wrapper a{
  text-decoration:none;
  color:#003a8f;
  font-size:15px;
  font-weight:500;
  margin:0 14px;
}

/* HIRE BUTTON */
.hire-btn{
  background:#003a8f;
  color:#fff;
  text-decoration:none;
  padding:12px 26px;
  border-radius:50px;
  font-size:14px;
  font-weight:600;
}

/* ===== HERO ===== */
.hero{
  padding:120px 40px;
  max-width:1100px;
  margin:auto;
}

.hero h1{
  font-size:56px;
  font-weight:700;
  margin-bottom:16px;
}

.hero p{
  font-size:20px;
  color:#555;
  max-width:700px;
  line-height:1.6;
}

/* ===== MOBILE ===== */
@media (max-width:768px){

  .header{
    padding:16px 20px;
  }

  .logo img{
    height:42px;
  }

  .nav-wrapper{
    display:none;
  }

  .hire-btn{
    padding:10px 18px;
    font-size:13px;
  }

  .hero{
    padding:80px 20px;
  }

  .hero h1{
    font-size:36px;
  }

  .hero p{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="logo.png" alt="Vaneet Tanwar">
  </div>

  <nav class="nav-wrapper">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </nav>

  <a href="#" class="hire-btn">Hire Me</a>
</header>

<section class="hero">
  <h1>Graphic Designer</h1>
  <p>
    I help brands communicate clearly through clean,
    impactful and conversion-focused design.
    With 7+ years of professional experience across
    corporate and freelance projects.
  </p>
</section>

</body>
</html>
